name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch football data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          from datetime import datetime, timezone

          key = os.environ.get("API_FOOTBALL_KEY")

          if not key:
              raise Exception("API_FOOTBALL_KEY secret is missing.")

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          url = f"https://v3.football.api-sports.io/fixtures?date={today}"

          print("Requesting football data for:", today)

          request = urllib.request.Request(
              url,
              headers={
                  "x-apisports-key": key,
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  raw = response.read().decode("utf-8")

              data = json.loads(raw)

          except Exception as e:
              print("API request failed:", e)
              raise

          print("API results:", data.get("results"))
          print("API errors:", data.get("errors"))

          if data.get("errors"):
              raise Exception(f"API returned errors: {data['errors']}")

          with open("football-data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("Football data downloaded successfully.")

          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add football-data.json

          if git diff --cached --quiet; then
            echo "No football data changes."
          else
            git commit -m "Update football data"
            git push
          fi
