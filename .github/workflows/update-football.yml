name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch football data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          key = os.environ["API_FOOTBALL_KEY"]

          url = "https://v3.football.api-sports.io/fixtures?next=20"

          request = urllib.request.Request(
              url,
              headers={
                  "x-apisports-key": key
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.loads(response.read().decode())

          with open("football-data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("Football data downloaded successfully.")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add football-data.json

          if git diff --cached --quiet; then
            echo "No football data changes."
          else
            git commit -m "Update football data"
            git push
          fi
